<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Drama Melolo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #f39c12; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-title { padding: 10px; font-size: 13px; height: 35px; overflow: hidden; }
        .btn-watch { background: #f39c12; color: white; padding: 10px; cursor: pointer; font-weight: bold; }
        
        #videoContainer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; flex-direction: column;
        }
        .close-btn { 
            position: absolute; top: 15px; right: 15px; background: #e74c3c; 
            color: white; padding: 10px; border-radius: 8px; z-index: 1001; border: none;
        }
        .loading-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-weight: bold; z-index: 999;
        }
    </style>
</head>
<body>
    <h2>🎬 KATALOG MELOLO</h2>
    <div id="katalog" class="grid"></div>

    <div id="videoContainer">
        <button class="close-btn" onclick="tutupVideo()">TUTUP [X]</button>
        <div id="loadingText" class="loading-overlay">Memuatkan video...</div>
        <video id="embedPlayer" controls autoplay style="width: 100%; height: 100%; background: black;">
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        
const API_URL = 'https://bot-dracin.onrender.com/api/films'; 

async function muatDrama() {
    try {
        const res = await fetch(API_URL);
        const dramas = await res.json();
        const katalogDiv = document.getElementById('katalog');
        
        if (dramas.length === 0) {
            katalogDiv.innerHTML = '<p style="text-align:center; width:100%;">Tiada drama dalam pangkalan data.</p>';
            return;
        }

        katalogDiv.innerHTML = '';
        dramas.forEach(drama => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${drama.thumb}" onerror="this.src='https://via.placeholder.com/140x200?text=No+Image'">
                <div class="card-title">${drama.judul}</div>
                <div class="btn-watch" onclick="bukaVideo('${drama.link}')">▶️ TONTON</div>
            `;
            katalogDiv.appendChild(card);
        });
    } catch (err) {
        console.error("Ralat muat data:", err);
        document.getElementById('katalog').innerHTML = '<p style="color:red; text-align:center;">Gagal menyambung ke pelayan API.</p>';
    }
}

function bukaVideo(url) {
    const container = document.getElementById('videoContainer');
    
    // Pastikan link menggunakan https
    const secureUrl = url.replace('http://', 'https://');
    
    // Kita gunakan iframe untuk paparkan website player asal
    container.innerHTML = `
        <button class="close-btn" onclick="tutupVideo()">TUTUP [X]</button>
        <iframe 
            src="${secureUrl}" 
            style="width: 100%; height: 100%; border: none;" 
            allow="autoplay; fullscreen; picture-in-picture" 
            allowfullscreen>
        </iframe>
    `;
    
    container.style.display = 'flex';
}

function tutupVideo() {
    const container = document.getElementById('videoContainer');
    container.innerHTML = ''; // Padam isi untuk hentikan suara/video
    container.style.display = 'none';
}

// Jalankan fungsi
muatDrama();

    </script>
</body>
</html>
