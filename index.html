<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Drama</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 15px;
        }
        h2 { text-align: center; color: #f39c12; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; height: 40px; overflow: hidden; }
        .btn-watch {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>🎬 KATALOG DRAMA</h2>

    <div class="grid" id="katalog">
        <div class="card">
            <img src="https://telegra.ph/file/example.jpg" alt="Poster">
            <div class="card-info">
                <div class="card-title">Tajuk Drama Akan Datang</div>
                <a href="#" class="btn-watch">Tonton Sekarang</a>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Besarkan paparan Mini App

        // Nota: Bahagian ini nanti akan kita sambungkan ke API MongoDB anda
        console.log("Mini App sedia!");
    </script>
</body>
</html>
