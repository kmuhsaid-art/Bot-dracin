<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Drama</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #f39c12;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .card {
            background: #2c2c2c;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-info {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            height: 40px;
            overflow: hidden;
        }
        .btn-watch {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h2>🎬 KATALOG DRAMA</h2>

    <div id="katalog" class="grid">
        <p style="text-align:center; width:100%;">Memuatkan drama...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // Memastikan WebApp dibuka dengan saiz penuh
        window.addEventListener('DOMContentLoaded', () => {
            tg.expand();
            muatDrama();
        });

        // URL API Render anda yang sudah diuji berfungsi
        const API_URL = 'https://bot-dracin.onrender.com/api/drama';

        async function muatDrama() {
            const katalogDiv = document.getElementById('katalog');
            
            try {
                // Fetch data dari Render dengan pencegahan cache
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                
                if (!response.ok) throw new Error("Gagal menyambung ke server");
                
                const dramas = await response.json();
                
                katalogDiv.innerHTML = ''; // Kosongkan mesej memuatkan

                if (!dramas || dramas.length === 0) {
                    katalogDiv.innerHTML = '<p style="text-align:center; width:100%; color:#f39c12;">Belum ada drama dalam database.</p>';
                    return;
                }

                // Melukis setiap drama ke dalam grid
                dramas.forEach(drama => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${drama.thumb}" alt="${drama.judul}" 
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/200x300?text=Tiada+Poster'">
                        <div class="card-info">
                            <div class="card-title">${drama.judul}</div>
                            <a href="${drama.link}" class="btn-watch">Tonton Sekarang</a>
                        </div>
                    `;
                    katalogDiv.appendChild(card);
                });
                
            } catch (err) {
                console.error("Ralat:", err);
                katalogDiv.innerHTML = `
                    <div style="text-align:center; width:100%; padding:20px;">
                        <p style="color:#e74c3c;">⚠️ Server sedang tidur atau ralat sambungan.</p>
                        <button onclick="location.reload()" style="padding:10px; border-radius:5px; border:none; background:#f39c12; color:white;">Cuba Lagi</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
