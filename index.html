<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Drama HTML5</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #f39c12; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 12px; text-align: center; }
        .card-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; height: 35px; overflow: hidden; }
        .btn-watch { display: block; background: linear-gradient(45deg, #27ae60, #2ecc71); color: white; padding: 10px; text-decoration: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Modal Video Player HTML5 */
        #videoPlayer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column; justify-content: center;
        }
        video { width: 100%; max-height: 70vh; background: black; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: #e74c3c; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 1001; }
        .video-controls { padding: 20px; text-align: center; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🎬 KATALOG DRAMA</h2>
    <div id="katalog" class="grid"></div>

    <div id="videoPlayer">
        <div class="close-btn" onclick="tutupVideo()">TUTUP [X]</div>
        <video id="html5Video" controls controlsList="nodownload">
            <source id="videoSource" src="" type="video/mp4">
            Peranti anda tidak menyokong pemain video HTML5.
        </video>
        <div class="video-controls">
            <p id="videoTitleDisplay"></p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = 'https://bot-dracin.onrender.com/api/drama';

        async function muatDrama() {
            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const dramas = await response.json();
                const katalogDiv = document.getElementById('katalog');
                katalogDiv.innerHTML = '';

                dramas.forEach(drama => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${drama.thumb}" onerror="this.src='https://via.placeholder.com/200x300?text=Poster+Tiada'">
                        <div class="card-info">
                            <div class="card-title">${drama.judul}</div>
                            <div class="btn-watch" onclick="bukaVideo('${drama.link}', '${drama.judul}')">▶️ TONTON</div>
                        </div>
                    `;
                    katalogDiv.appendChild(card);
                });
            } catch (err) { 
                console.error(err); 
                document.getElementById('katalog').innerHTML = '<p style="text-align:center;">Gagal memuatkan data server.</p>';
            }
        }

        function bukaVideo(url, judul) {
            const player = document.getElementById('videoPlayer');
            const video = document.getElementById('html5Video');
            const source = document.getElementById('videoSource');
            const titleDisplay = document.getElementById('videoTitleDisplay');
            
            source.src = url;
            titleDisplay.innerText = "Sedang Memainkan: " + judul;
            video.load(); // Wajib untuk muat pautan video baru
            player.style.display = 'flex';
            video.play();
        }

        function tutupVideo() {
            const player = document.getElementById('videoPlayer');
            const video = document.getElementById('html5Video');
            video.pause(); // Hentikan bunyi
            player.style.display = 'none';
        }

        muatDrama();
    </script>
</body>
</html>
