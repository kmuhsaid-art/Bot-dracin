<script>
    // 1. Inisialisasi Telegram WebApp
    const tg = window.Telegram.WebApp;
    
    // Pastikan kod berjalan hanya selepas dokumen sedia
    window.addEventListener('DOMContentLoaded', () => {
        tg.expand();
        muatDrama();
    });

    // URL API Render anda
    const API_URL = 'https://bot-dracin.onrender.com/api/drama';

    async function muatDrama() {
        const katalogDiv = document.getElementById('katalog');
        
        // Safety check: Pastikan elemen 'katalog' wujud dalam HTML
        if (!katalogDiv) {
            console.error("Elemen 'katalog' tidak dijumpai dalam HTML!");
            return;
        }

        try {
            // Tambah timeout atau timestamp untuk elakkan cache browser
            const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
            
            if (!response.ok) throw new Error("Respon server gagal");
            
            const dramas = await response.json();
            
            katalogDiv.innerHTML = ''; // Kosongkan placeholder

            if (!dramas || dramas.length === 0) {
                katalogDiv.innerHTML = '<p style="text-align:center; width:100%; color:#f39c12;">Belum ada drama dalam database.</p>';
                return;
            }

            dramas.forEach(drama => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${drama.thumb}" alt="${drama.judul}" 
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/200x300?text=Poster+Error'">
                    <div class="card-info">
                        <div class="card-title">${drama.judul}</div>
                        <a href="${drama.link}" class="btn-watch">Tonton Sekarang</a>
                    </div>
                `;
                katalogDiv.appendChild(card);
            });
            
        } catch (err) {
            console.error("Ralat Fetch:", err);
            katalogDiv.innerHTML = `
                <div style="text-align:center; width:100%; padding:20px;">
                    <p style="color:#e74c3c;">⚠️ Gagal menyambung ke server.</p>
                    <small style="color:#999;">Pastikan bot di Render sedang 'Live'</small>
                </div>
            `;
        }
    }
</script>
