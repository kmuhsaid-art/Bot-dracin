<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Pastikan URL ini tepat seperti di dashboard Render anda
    const API_URL = 'https://bot-dracin.onrender.com/api/drama';

    async function muatDrama() {
        try {
            const response = await fetch(API_URL);
            const dramas = await response.json();
            
            const katalogDiv = document.getElementById('katalog');
            katalogDiv.innerHTML = ''; // Memadamkan kotak "Akan Datang" tadi

            if (dramas.length === 0) {
                katalogDiv.innerHTML = '<p style="text-align:center; width:100%;">Tiada drama dijumpai.</p>';
                return;
            }

            dramas.forEach(drama => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${drama.thumb}" alt="${drama.judul}" onerror="this.src='https://via.placeholder.com/200x300?text=Tiada+Poster'">
                    <div class="card-info">
                        <div class="card-title">${drama.judul}</div>
                        <a href="${drama.link}" class="btn-watch">Tonton Sekarang</a>
                    </div>
                `;
                katalogDiv.appendChild(card);
            });
        } catch (err) {
            console.error("Ralat:", err);
            document.getElementById('katalog').innerHTML = '<p style="text-align:center; width:100%;">Gagal memuatkan katalog.</p>';
        }
    }

    muatDrama();
</script>
