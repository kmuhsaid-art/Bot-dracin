<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Drama Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #f39c12; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 12px; text-align: center; }
        .card-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; height: 35px; overflow: hidden; }
        .btn-watch { display: block; background: linear-gradient(45deg, #e67e22, #f39c12); color: white; padding: 10px; text-decoration: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Modal Video Player (Iframe) - Diperkukuh untuk Mobile */
        #videoContainer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; flex-direction: column;
        }
        iframe { width: 100%; height: 100%; border: none; background: black; }
        .close-btn { 
            position: absolute; top: 15px; right: 15px; background: #e74c3c; 
            color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; z-index: 1001; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .loading-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #555; z-index: 999; pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>🎬 KATALOG DRAMA</h2>
    <div id="katalog" class="grid"></div>

    <div id="videoContainer">
        <button class="close-btn" onclick="tutupVideo()">TUTUP [X]</button>
        <div class="loading-overlay">Memuatkan video...</div>
<iframe 
    id="embedPlayer" 
    src="" 
    allowfullscreen="true" 
    webkitallowfullscreen="true" 
    mozallowfullscreen="true"
    allow="autoplay; encrypted-media; picture-in-picture"
    sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-presentation"
    style="width: 100%; height: 100%; border: none;">
</iframe>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = 'https://bot-dracin.onrender.com/api/drama';

        async function muatDrama() {
            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const dramas = await response.json();
                const katalogDiv = document.getElementById('katalog');
                katalogDiv.innerHTML = '';

                if (dramas.length === 0) {
                    katalogDiv.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Katalog kosong. Taip /sync di bot.</p>';
                    return;
                }

                dramas.forEach(drama => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${drama.thumb}" onerror="this.src='https://via.placeholder.com/200x300?text=Poster+Tiada'">
                        <div class="card-info">
                            <div class="card-title">${drama.judul}</div>
                            <div class="btn-watch" onclick="bukaVideo('${drama.link}')">▶️ TONTON</div>
                        </div>
                    `;
                    katalogDiv.appendChild(card);
                });
            } catch (err) { 
                console.error(err); 
                document.getElementById('katalog').innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Gagal menyambung ke server.</p>';
            }
        }

        function bukaVideo(url) {
            const container = document.getElementById('videoContainer');
            const iframe = document.getElementById('embedPlayer');
            
            // Pastikan URL menggunakan HTTPS
            const secureUrl = url.replace('http://', 'https://');
            
            iframe.src = secureUrl;
            container.style.display = 'flex';
        }

        function tutupVideo() {
            const container = document.getElementById('videoContainer');
            const iframe = document.getElementById('embedPlayer');
            
            iframe.src = ''; 
            container.style.display = 'none';
        }

        muatDrama();
    </script>
</body>
</html>
